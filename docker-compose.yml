
services:
  postgres:
    image: postgres:17-alpine
    container_name: debugdesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: debugdesk
      POSTGRES_USER: debugdesk
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debugdesk -d debugdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
